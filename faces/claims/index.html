<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claims and hand-backs</title>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <h1>Claims and hand-backs</h1>
    <p class="muted">Every claimed item by holder, expired leases first, and every item handed back, by whose turn it is.</p>
    <form id="pick">
      <label>Ledger <input name="ledger" value="default" autocomplete="off"></label>
      <button type="submit">Show</button>
    </form>
    <p role="status" aria-live="polite"></p>
    <div id="out"></div>
  </main>
</body>
</html>
