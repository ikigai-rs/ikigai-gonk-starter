name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Tests (the scenario vectors, the service, the client, specs against vectors)
        # The same command `just gates` runs locally. Standard library only, no imports from
        # a registry: nothing to fetch, so the build needs no network.
        run: python3 scripts/test.py
