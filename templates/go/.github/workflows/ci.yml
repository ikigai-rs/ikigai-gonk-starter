name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: false
      - name: Tests (the scenario vectors, the service, the client, specs against vectors)
        # The same command `just gates` runs locally. Standard library only, no modules from
        # a registry: nothing to fetch, so the build needs no network.
        run: python3 scripts/test.py
