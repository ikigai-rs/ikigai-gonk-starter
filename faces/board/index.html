<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Epic board</title>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <h1>Epic board</h1>
    <p class="muted">An epic's children in five columns: blocked, ready, in flight, awaiting their dispatcher, and done.</p>
    <form id="pick">
      <label>Ledger <input name="ledger" value="default" autocomplete="off"></label>
      <label>Open item <select name="picked"></select></label>
      <label>Epic item number <input name="epic" inputmode="numeric" required></label>
      <button type="submit">Show board</button>
    </form>
    <p role="status" aria-live="polite"></p>
    <div id="out"></div>
  </main>
</body>
</html>
